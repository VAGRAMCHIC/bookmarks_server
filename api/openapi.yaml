openapi: 3.1.0
info:
  title: Bookmarks Sync API
  version: "2.0.0"
  summary: Синхронизация библиотеки читалки Bookmarks между устройствами.
  description: |
    Сервер хранит записи о книгах (место чтения, число страниц, название) и,
    по желанию клиента, сами файлы книг. Протокол подробно описан в
    docs/sync/README.md.

    ## Транспорт и аутентификация

    * Только HTTPS, TLS 1.3 (TLS 1.2 допустим с ECDHE + AEAD). Порт по
      умолчанию 8443.
    * Удостоверяющих центров нет. Сервер и каждое устройство создают
      собственный ключ ECDSA P-256 и самоподписанный сертификат.
    * Отпечаток сертификата: SHA-256 от DER, 64 строчные hex-цифры.
    * Сервер **всегда** запрашивает клиентский сертификат и принимает любой
      на уровне TLS (в Go: `tls.RequireAnyClientCert`), а проверяет его сам:
      отпечаток должен принадлежать сопряжённому устройству. Без
      сертификата или с неизвестным отпечатком доступен только
      `POST /v1/pair`, остальное отвечает 401.
    * Клиент не доверяет никаким корневым сертификатам и принимает сервер,
      только если отпечаток совпал с запомненным при сопряжении.

    ## Сопряжение

    1. Администратор запускает на сервере `pair`; сервер показывает
       одноразовый код из 16 символов base32 Крокфорда
       (`XXXX-XXXX-XXXX-XXXX`, 80 бит, живёт 10 минут).
    2. Клиент подключается с новым сертификатом, видит отпечаток сервера
       `S` (свой — `C`) и шлёт `clientProof`.
    3. Сервер проверяет `clientProof` по своему отпечатку и отпечатку
       клиентского сертификата из TLS, запоминает устройство, гасит код и
       отвечает `serverProof`.
    4. Клиент проверяет `serverProof` и запоминает `S`.

    Доказательства:
    `HMAC-SHA256(key = normalize(code), msg = "bookmarks-pair-v1|<role>|<S>|<C>")`,
    `role` — `client` или `server`, результат — 64 строчные hex-цифры.
    `normalize`: в верхний регистр, убрать пробелы и дефисы, O→0, I→1, L→1.
    Код по сети не передаётся; посредник с поддельным сертификатом не
    сможет ни подтвердить код серверу, ни подделать ответ клиенту.

    ## Записи и разрешение конфликтов

    Ключ записи — `bookId`, идентификатор по содержимому файла:
    `"b1_" + hex(SHA-256(ascii(size) + "\n" + first64KiB + last64KiB))`,
    для файлов до 128 КиБ — `"b1_" + hex(SHA-256(ascii(size) + "\n" + file))`.
    Один и тот же файл на разных устройствах даёт один `bookId`.

    Побеждает версия с большим `updatedAt` (мс, часы клиента). При равенстве
    остаётся сохранённая. Каждая принятая запись и каждая загрузка файла
    получает новый `rev` — номер в монотонной ленте изменений сервера.

    ## Закладки (с версии 2)

    Закладка — отдельная запись с id, который создаёт клиент (32 hex-символа,
    128 случайных бит), и `bookId` книги. Конфликты — по тем же правилам:
    побеждает больший `updatedAt`, при равенстве остаётся сохранённая.
    Удаление — это запись с `deleted: true` (tombstone): сервер хранит её
    бессрочно, чтобы удаление дошло до всех устройств, и тоже выдаёт в ленте
    изменений. Удалённую закладку можно вернуть более поздней записью с
    `deleted: false`.

    `rev` у записей о книгах и у закладок — из одного общего счётчика, но
    ленты изменений и курсоры у них отдельные. Книга с таким `bookId` на
    сервере может и не быть: закладки от неё не зависят.

    ## Версии

    `apiVersion` в `/v1/info`: 1 — книги и файлы, 2 — плюс закладки. Клиент
    версии 2 работает и с сервером версии 1: ответ 404 на методы закладок он
    понимает как «закладки не поддерживаются» и синхронизирует остальное.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: https://{host}:{port}
    variables:
      host:
        default: localhost
      port:
        default: "8443"
security:
  - deviceCertificate: []
tags:
  - name: pairing
  - name: devices
  - name: library
  - name: files
  - name: bookmarks

paths:
  /v1/pair:
    post:
      tags: [pairing]
      operationId: pair
      summary: Сопрячь устройство по одноразовому коду
      description: |
        Единственный метод, доступный с неизвестным сертификатом. Сертификат
        клиента берётся из TLS-рукопожатия, а не из тела запроса. Сервер
        должен ограничивать попытки (например, 5 в минуту с одного IP и
        гасить код после 10 неудачных попыток).
      security:
        - anyCertificate: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PairRequest" }
      responses:
        "200":
          description: Устройство сопряжено.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PairResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Клиент не предъявил сертификат (`no_client_certificate`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: |
            Код неверный, истёк или не запрошен (`invalid_pairing_code`).
            Ответ одинаковый во всех случаях.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Этот сертификат уже сопряжён (`already_paired`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/info:
    get:
      tags: [devices]
      operationId: getInfo
      summary: Сведения о сервере и проверка сопряжения
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: Сопряжённые устройства
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices/me:
    delete:
      tags: [devices]
      operationId: unpairSelf
      summary: Отменить сопряжение этого устройства
      description: Сервер забывает сертификат устройства. Записи и файлы остаются.
      responses:
        "204": { description: Готово. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: removeDevice
      summary: Отключить другое устройство (например, потерянное)
      parameters:
        - name: deviceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Готово. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/library/changes:
    get:
      tags: [library]
      operationId: getChanges
      summary: Записи, изменённые после курсора
      description: |
        Возвращает записи с `rev > since` по возрастанию `rev`. Клиент
        повторяет запрос с `since = cursor`, пока `hasMore = true`.
      parameters:
        - name: since
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/library/records:
    post:
      tags: [library]
      operationId: pushRecords
      summary: Отправить изменённые записи
      description: |
        Для каждой записи сервер сохраняет её, если записи с таким `bookId`
        нет или у присланной `updatedAt` больше. В ответе — то, что лежит на
        сервере после обработки, в том же порядке (по одной записи на каждую
        присланную). Обработка атомарна: при ошибке не сохраняется ничего.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                records:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/BookRecordInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [records]
                properties:
                  records:
                    type: array
                    items: { $ref: "#/components/schemas/BookRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/bookmarks/changes:
    get:
      tags: [bookmarks]
      operationId: getBookmarkChanges
      summary: Закладки, изменённые после курсора (включая удалённые)
      description: |
        Возвращает закладки с `rev > since` по возрастанию `rev`, в том числе
        tombstone (`deleted: true`). Клиент повторяет запрос с
        `since = cursor`, пока `hasMore = true`. Курсор отдельный от
        `/v1/library/changes`.
      parameters:
        - name: since
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookmarkChangesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/bookmarks:
    post:
      tags: [bookmarks]
      operationId: pushBookmarks
      summary: Создать, изменить или удалить закладки
      description: |
        Для каждой закладки сервер сохраняет её, если закладки с таким `id`
        нет или у присланной `updatedAt` строго больше. Удаление — закладка с
        `deleted: true`. Тогда `rev = ++counter`, `updatedBy` = id
        устройства. В ответе — то, что лежит на сервере после обработки, по
        одной закладке на каждую присланную и в том же порядке. Обработка
        атомарна: при ошибке не сохраняется ничего.

        Если закладка с этим `id` уже есть, но с другим `bookId`, — 409
        `bookmark_conflict` для всего запроса (так не бывает при случайных id
        и означает ошибку клиента).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookmarks]
              properties:
                bookmarks:
                  type: array
                  maxItems: 500
                  items: { $ref: "#/components/schemas/BookmarkInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [bookmarks]
                properties:
                  bookmarks:
                    type: array
                    items: { $ref: "#/components/schemas/Bookmark" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Закладка с этим id принадлежит другой книге (`bookmark_conflict`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/books/{bookId}/file:
    parameters:
      - $ref: "#/components/parameters/BookId"
    put:
      tags: [files]
      operationId: uploadFile
      summary: Загрузить файл книги
      description: |
        Тело — файл целиком. Сервер пересчитывает `bookId` по содержимому и
        отклоняет несовпадение (422). Запись с этим `bookId` должна уже
        существовать (404 иначе). После загрузки у записи `hasFile = true` и
        новый `rev`. Повторная загрузка того же файла — 204 без изменений.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Файл сохранён. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "411": { description: Нет Content-Length. }
        "413": { $ref: "#/components/responses/TooLarge" }
        "422":
          description: Содержимое не соответствует bookId (`book_id_mismatch`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "507": { description: На сервере закончилось место (`insufficient_storage`). }
    get:
      tags: [files]
      operationId: downloadFile
      summary: Скачать файл книги
      description: Поддерживает заголовок Range для докачки.
      responses:
        "200":
          description: Файл.
          headers:
            Content-Length: { schema: { type: integer } }
            ETag:
              description: Совпадает с bookId в кавычках.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206": { description: Часть файла по Range. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    head:
      tags: [files]
      operationId: headFile
      summary: Есть ли файл на сервере
      responses:
        "200": { description: Есть. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Нет. }

components:
  securitySchemes:
    deviceCertificate:
      type: mutualTLS
      description: |
        Самоподписанный сертификат устройства, отпечаток которого сервер
        запомнил при сопряжении.
    anyCertificate:
      type: mutualTLS
      description: Любой самоподписанный сертификат (только для сопряжения).

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/BookId" }

  schemas:
    BookId:
      type: string
      pattern: "^b1_[0-9a-f]{64}$"
      description: Идентификатор книги по содержимому (см. описание API).
      examples: ["b1_9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]

    Fingerprint:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: SHA-256 от DER сертификата.

    PairRequest:
      type: object
      required: [deviceName, platform, clientProof]
      properties:
        deviceName: { type: string, minLength: 1, maxLength: 100 }
        platform:
          type: string
          description: Значение Platform.operatingSystem клиента.
          examples: [linux, windows, android]
        clientProof:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: HMAC с ролью `client`.

    PairResponse:
      type: object
      required: [deviceId, serverName, serverProof]
      properties:
        deviceId: { type: string, description: Постоянный id устройства на сервере. }
        serverName: { type: string }
        serverProof:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: HMAC с ролью `server`.

    ServerInfo:
      type: object
      required: [serverName, apiVersion, deviceId, time]
      properties:
        serverName: { type: string }
        apiVersion:
          type: integer
          enum: [1, 2]
          description: 2 — сервер поддерживает закладки.
        deviceId: { type: string, description: "Id устройства, сделавшего запрос." }
        time: { type: string, format: date-time }
        maxFileSize: { type: integer, format: int64 }

    Device:
      type: object
      required: [deviceId, deviceName, platform, fingerprint, pairedAt]
      properties:
        deviceId: { type: string }
        deviceName: { type: string }
        platform: { type: string }
        fingerprint: { $ref: "#/components/schemas/Fingerprint" }
        pairedAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        current: { type: boolean, description: Это устройство сделало запрос. }

    BookRecordInput:
      type: object
      required: [bookId, fileName, fileSize, updatedAt]
      properties:
        bookId: { $ref: "#/components/schemas/BookId" }
        fileName:
          type: string
          maxLength: 255
          description: Имя файла на устройстве-источнике, без пути.
        fileSize: { type: integer, format: int64, minimum: 0 }
        title: { type: [string, "null"], maxLength: 1000 }
        lastPage: { type: integer, minimum: 0, default: 0, description: С нуля. }
        pageCount: { type: integer, minimum: 0, default: 0 }
        progress:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: Доля прочитанного; по ней переносится место при другом числе страниц.
        updatedAt:
          type: integer
          format: int64
          description: Время изменения места чтения, мс с начала эпохи (часы клиента).
        deleted: { type: boolean, default: false }

    BookRecord:
      allOf:
        - $ref: "#/components/schemas/BookRecordInput"
        - type: object
          required: [hasFile, updatedBy, rev]
          properties:
            hasFile: { type: boolean, description: Файл книги есть на сервере. }
            updatedBy: { type: string, description: deviceId автора этой версии. }
            rev: { type: integer, format: int64, description: Номер изменения. }

    ChangesResponse:
      type: object
      required: [records, cursor, hasMore]
      properties:
        records:
          type: array
          items: { $ref: "#/components/schemas/BookRecord" }
        cursor:
          type: integer
          format: int64
          description: rev последней записи в ответе (или since, если записей нет).
        hasMore: { type: boolean }

    BookmarkId:
      type: string
      pattern: "^[0-9a-f]{32}$"
      description: Создаётся клиентом, 128 случайных бит.

    BookmarkInput:
      type: object
      required: [id, bookId, page, pageCount, createdAt, updatedAt]
      properties:
        id: { $ref: "#/components/schemas/BookmarkId" }
        bookId: { $ref: "#/components/schemas/BookId" }
        page: { type: integer, minimum: 0, description: Страница с нуля. }
        pageCount:
          type: integer
          minimum: 0
          description: Сколько страниц было в книге, когда ставили закладку.
        progress:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: |
            Доля книги до закладки; по ней закладка переносится, если на
            другом устройстве число страниц другое.
        note:
          type: [string, "null"]
          maxLength: 1000
          description: Заметка пользователя.
        snippet:
          type: [string, "null"]
          maxLength: 200
          description: Начало текста страницы — чтобы узнать закладку в списке.
        createdAt:
          type: integer
          format: int64
          description: Когда поставлена, мс с начала эпохи (часы клиента).
        updatedAt:
          type: integer
          format: int64
          description: Когда изменена (заметка, удаление), мс с начала эпохи.
        deleted:
          type: boolean
          default: false
          description: Закладка удалена (tombstone).

    Bookmark:
      allOf:
        - $ref: "#/components/schemas/BookmarkInput"
        - type: object
          required: [updatedBy, rev]
          properties:
            updatedBy: { type: string, description: deviceId автора этой версии. }
            rev: { type: integer, format: int64, description: Номер изменения. }

    BookmarkChangesResponse:
      type: object
      required: [bookmarks, cursor, hasMore]
      properties:
        bookmarks:
          type: array
          items: { $ref: "#/components/schemas/Bookmark" }
        cursor:
          type: integer
          format: int64
          description: rev последней закладки в ответе (или since, если их нет).
        hasMore: { type: boolean }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машинный код, например invalid_pairing_code.
            message:
              type: string
              description: Понятное пользователю сообщение (на русском).

  responses:
    BadRequest:
      description: Неверный запрос (`bad_request`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Нет сертификата или устройство не сопряжено (`unknown_device`).
        Клиент, получив 401, забывает сервер и предлагает сопрячь заново.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Не найдено (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: Слишком большой запрос или файл (`too_large`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Слишком много попыток (`rate_limited`), см. Retry-After.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
